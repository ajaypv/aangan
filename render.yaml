# Render blueprint: New + > Blueprint, pick this repository. Secrets are entered in the dashboard (sync: false).
# Free plan: no card, but the service sleeps after 15 minutes idle (about a minute to wake) and has no disk, so a
# restart empties the household. Keep it awake with a free pinger on /api/config; switch `plan` to starter and add a
# disk (mountPath /data) if the family must survive restarts.
services:
  - type: web
    name: aangan
    runtime: docker
    plan: free
    healthCheckPath: /api/config
    envVars:
      - key: AANGAN_LANGUAGE_MODE
        value: multi              # English, Hindi, Telugu and Kannada, following what is said. Settings can switch a household to english.
      - key: AI_GATEWAY_MODEL
        value: openai/gpt-4o-mini
      - key: MURF_MODEL
        value: FALCON
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      # Cloudflare AI Gateway, tried first; the Vercel gateway above is the backup. Leave the token and account id out to skip it.
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_GATEWAY_ID
        value: hack
      - key: CLOUDFLARE_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_API_KEY          # Bearer secret Agora sends to /v1/chat/completions: any long random string
        generateValue: true
      - key: MCP_API_KEY          # Bearer token other agents send to /mcp (read it from this dashboard to connect them)
        generateValue: true
      # PUBLIC_BASE_URL is not needed: the backend uses the RENDER_EXTERNAL_URL that Render sets itself
